<style>
:root{
  /* Layout: ba bảng nổi quanh mặt bàn dàn trang xám; màu đường gióng theo quy ước nhà in (tràn lề đỏ, an toàn xanh lơ, gáy tím) */
  --bg:#e6e7eb; --panel:#fbfbfc; --panel-2:#f0f1f4; --line:#dcdee4; --line-2:#c6c9d1;
  --fg:#1a1c21; --muted:#5f6571; --faint:#8a8f99;
  --accent:#b8215f; --accent-ink:#ffffff; --accent-soft:rgba(184,33,95,.09); --accent-line:rgba(184,33,95,.5);
  --board:#d2d5dc; --ruler:#f6f7f9; --ruler-fg:#565b66; --ruler-tick:#9ea3ad; --ruler-page:#ffffff; --ruler-mark:#b8215f;
  --g-bleed:#e0464c; --g-safe:#0a93b8; --g-fold:#7657f2; --g-guide:#009fd4;
  --paper:#ffffff; --ph:#ebeae6; --ph-fg:#8d8b84; --lay-ph:#c5c8d0; --lay-tx:#a3a8b1;
  --warn:#c2410c; --mid:#a16207; --ok:#15803d;
  --scrim:rgba(14,15,18,.92); --scrim-fg:#f1f2f4;
  --shadow:0 1px 2px rgba(18,20,28,.06),0 8px 24px rgba(18,20,28,.08);
  --sheet-shadow:0 1px 3px rgba(0,0,0,.16),0 12px 32px rgba(0,0,0,.14);
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --f-display:"Playfair Display",Georgia,"Times New Roman",serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --panel:#1b1e22; --panel-2:#24282d; --line:#2f333a; --line-2:#3d424a;
  --fg:#e6e8ec; --muted:#9ca2ac; --faint:#737983;
  --accent:#ff5c9a; --accent-ink:#2a0614; --accent-soft:rgba(255,92,154,.13); --accent-line:rgba(255,92,154,.55);
  --board:#272a30; --ruler:#181b1f; --ruler-fg:#a5abb5; --ruler-tick:#535963; --ruler-page:#2b2f35; --ruler-mark:#ff5c9a;
  --g-guide:#2bc4f5; --warn:#fb923c; --mid:#facc15; --ok:#4ade80;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.4);
  --sheet-shadow:0 2px 6px rgba(0,0,0,.45),0 16px 40px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --panel:#1b1e22; --panel-2:#24282d; --line:#2f333a; --line-2:#3d424a;
  --fg:#e6e8ec; --muted:#9ca2ac; --faint:#737983;
  --accent:#ff5c9a; --accent-ink:#2a0614; --accent-soft:rgba(255,92,154,.13); --accent-line:rgba(255,92,154,.55);
  --board:#272a30; --ruler:#181b1f; --ruler-fg:#a5abb5; --ruler-tick:#535963; --ruler-page:#2b2f35; --ruler-mark:#ff5c9a;
  --g-guide:#2bc4f5; --warn:#fb923c; --mid:#facc15; --ok:#4ade80;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.4);
  --sheet-shadow:0 2px 6px rgba(0,0,0,.45),0 16px 40px rgba(0,0,0,.45);
  color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding-inline:16px;padding-block:10px}

/* ---------- buttons & controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);background:var(--panel);border-radius:9px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--panel-2);border-color:var(--line-2)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.icon{width:34px;padding:0}
.btn.icon.sm{width:30px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.btn.danger:hover{color:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.38;cursor:default;pointer-events:none}
.btn.grow{flex:1}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;height:30px;padding:0 11px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg.sm button{height:26px;padding:0 9px;font-size:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.lbl{font-size:12px;color:var(--muted);font-weight:500}
.hint{margin:8px 0 0;font-size:12px;color:var(--faint);line-height:1.5}
.muted{color:var(--muted);font-size:13px;margin:0 0 10px}
input[type=range]{accent-color:var(--accent);width:100%;margin:4px 0 0}
input[type=number],select,textarea,input[type=text]{font:inherit;font-size:13px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;color:var(--fg);padding:5px 8px;min-width:0}
input[type=number]{width:74px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
textarea{width:100%;resize:vertical;line-height:1.45}
select{height:32px}
input[type=color]{width:34px;height:28px;padding:2px;border:1px solid var(--line);border-radius:7px;background:var(--panel);cursor:pointer}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:10px;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand em{font-style:italic;font-weight:400;color:var(--accent)}
.mark{width:28px;height:28px;color:var(--fg)}
.chip{font:500 12px var(--f-mono);padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.grp{display:flex;gap:4px}
.pnav{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px}
.pnav .btn{border-color:transparent;background:transparent;height:30px;width:30px}
.pnav-lab{display:flex;flex-direction:column;align-items:center;min-width:118px;line-height:1.15;padding:0 4px}
.pnav-lab b{font-size:13px}
.pnav-lab span{font:500 11px var(--f-mono);color:var(--muted)}
.sp{flex:1}
.mob,.panel-h.mob{display:none}

/* ---------- main grid ---------- */
.main{display:grid;grid-template-columns:304px minmax(0,1fr) 292px;gap:10px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600}
.scroll{overflow:auto;flex:1;padding:14px;min-height:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);flex:none}
.tabs button{height:44px;border:0;background:none;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.sec{padding:14px 0;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;padding-top:0}
.sec h3{margin:0 0 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rg{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 10px;font-size:13px;margin-bottom:10px}
.rg output{font:500 12px var(--f-mono);color:var(--muted)}
.rg input{grid-column:1/-1}

/* library */
.lib-top{display:flex;gap:6px;margin-bottom:10px}
.dropzone{border:1.5px dashed var(--line-2);border-radius:10px;padding:12px;text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:12px;transition:background .12s,border-color .12s}
.dropzone.over,.panel.left.over .dropzone{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.banner{display:grid;gap:3px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--accent-line);font-size:12.5px;margin-bottom:12px}
.banner b{color:var(--accent)}
.banner .link{justify-self:start;margin-top:2px}
.lib-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.lib-meta b{color:var(--fg)}
.lib{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.th{margin:0;position:relative;aspect-ratio:1;border-radius:7px;overflow:hidden;background:var(--panel-2);cursor:grab;outline:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.th:hover{outline:2px solid var(--accent-line)}
.th .cnt{position:absolute;right:4px;top:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:600 11px/18px var(--f-mono);text-align:center}
.th:not(.used)::after{content:"";position:absolute;left:5px;bottom:5px;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.35)}
.th .del{position:absolute;left:4px;top:4px;width:22px;height:22px;border-radius:6px;border:0;background:rgba(15,16,20,.72);color:#fff;display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .12s}
.th .del .i{width:13px;height:13px}
.th:hover .del,.th .del:focus-visible{opacity:1}
.empty{font-size:13px;color:var(--muted);text-align:center;padding:24px 8px}

/* layouts */
.lay-target{margin-bottom:12px}
.lay-target .lbl{display:block;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.chipb{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:12.5px;font-weight:500;color:var(--muted)}
.chipb.on{background:var(--fg);border-color:var(--fg);color:var(--panel)}
.lays{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;grid-auto-flow:dense}
.lay{display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;text-align:left;min-width:0}
.lay:hover{border-color:var(--accent-line)}
.lay.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft)}
.lay.wide{grid-column:span 2}
.lay svg{width:100%;height:auto;display:block;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lay span{display:grid;line-height:1.3;min-width:0}
.lay b{font-size:12px;font-weight:600}
.lay em{font-style:normal;font-size:11px;color:var(--faint)}
.lay .pg{fill:var(--paper)}
.lay .fr{fill:var(--lay-ph)}
.lay .pol{fill:var(--lay-ph);stroke:var(--paper);stroke-width:4}
.lay .tx{fill:var(--lay-tx)}
.lay .fd{stroke:var(--g-fold);stroke-width:1;stroke-dasharray:3 3}
.lay .spn{fill:var(--g-fold);opacity:.16}

/* album tab */
.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pre{display:grid;grid-template-columns:34px 1fr;grid-template-rows:auto auto;align-items:center;column-gap:8px;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--panel);cursor:pointer;text-align:left}
.pre i{grid-row:1/3;justify-self:center;border:1.5px solid var(--muted);border-radius:2px;background:var(--panel-2)}
.pre b{font:600 12.5px var(--f-mono)}
.pre span{font-size:11px;color:var(--faint)}
.pre.on{border-color:var(--accent);background:var(--accent-soft)}
.pre.on i{border-color:var(--accent)}
.custom{display:flex;align-items:flex-end;gap:8px;margin-top:12px}
.custom label,.fields label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.custom label>div,.fields label>div{display:flex;align-items:center;gap:5px}
.custom i,.fields i,.xywh i{font-style:normal;font-size:12px;color:var(--faint)}
.custom>span{padding-bottom:7px;color:var(--faint)}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0;line-height:1.5}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pages{display:flex;align-items:center;gap:10px}
.pages b{font:600 15px var(--f-mono);min-width:64px;text-align:center}

/* properties */
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:14px}
.phead div{display:grid;line-height:1.3}
.phead b{font-size:15px}
.phead span{font-size:12px;color:var(--muted)}
.bgrow{display:grid;gap:6px;margin-bottom:12px}
.bgrow>span{font-size:12.5px;font-weight:500}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.pinfo{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;margin-bottom:12px}
.pinfo img{width:52px;height:52px;object-fit:cover;border-radius:6px}
.pinfo div{display:grid;min-width:0;font-size:12px;color:var(--muted);line-height:1.4}
.pinfo b{color:var(--fg);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dpi{font-weight:600}
.dpi.ok{color:var(--ok)} .dpi.mid{color:var(--mid)} .dpi.bad{color:var(--warn)}
.anchor-wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}
.anchor{display:grid;grid-template-columns:repeat(3,22px);gap:3px;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.anchor button{width:22px;height:22px;border:1px solid var(--line-2);border-radius:4px;background:var(--panel);cursor:pointer;padding:0}
.anchor button:hover{background:var(--accent);border-color:var(--accent)}
.xywh{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.xywh label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.xywh label span{width:30px}
.xywh input{width:100%}
.aligns{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:10px 0}
.aligns .btn{width:auto}
.tips{margin:0;padding-left:18px;font-size:12.5px;color:var(--muted);display:grid;gap:6px}
.tips b{color:var(--fg);font-weight:600}
.fontsel{width:100%;margin-bottom:8px}

/* ---------- stage ---------- */
.stage{position:relative;display:grid;grid-template-columns:24px minmax(0,1fr);grid-template-rows:24px minmax(0,1fr) auto;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--board);min-width:0;min-height:0}
.corner{grid-column:1;grid-row:1;background:var(--ruler);border-right:1px solid var(--line);border-bottom:1px solid var(--line);font:500 9px var(--f-mono);display:grid;place-items:center;color:var(--ruler-fg)}
#rT{grid-column:2;grid-row:1;width:100%;height:24px;display:block;cursor:s-resize;touch-action:none}
#rL{grid-column:1;grid-row:2;width:24px;height:100%;display:block;cursor:e-resize;touch-action:none}
#vp{grid-column:2;grid-row:2;overflow:auto;position:relative;min-width:0;min-height:0}
#ws{position:relative}
#sheetWrap{position:absolute}
#guideLayer{position:absolute;inset:0;pointer-events:none;z-index:6}
.viewbar{grid-column:1/3;grid-row:3;display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;padding:6px 10px;background:var(--panel);border-top:1px solid var(--line)}
.tgs{gap:4px}
.tg{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:7px;border:1px solid transparent;background:transparent;cursor:pointer;font-size:12px;font-weight:500;color:var(--faint)}
.tg .dot{width:9px;height:9px;border-radius:2px;opacity:.35}
.tg.on{color:var(--fg);background:var(--panel-2);border-color:var(--line)}
.tg.on .dot{opacity:1}
.pos{font-size:11.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
.zoom{display:flex;align-items:center;gap:4px}
.zl{min-width:54px;height:30px;border:0;background:none;cursor:pointer;font:500 12px var(--f-mono);color:var(--fg)}

/* sheet */
.sheet{position:relative;touch-action:none}
.clip{position:absolute;overflow:hidden;box-shadow:var(--sheet-shadow)}
.sheet.thumb .clip{box-shadow:0 1px 3px rgba(0,0,0,.22)}
.sheet.view .clip{box-shadow:none}
.org{position:absolute;left:0;top:0;width:0;height:0}
.pbg{position:absolute}
.frame{position:absolute;transform-origin:center}
.fin{position:absolute;inset:0;overflow:hidden}
.box{position:relative;width:100%;height:100%;overflow:hidden;container-type:size}
.box img{position:absolute;left:50%;top:50%;max-width:none!important;max-height:none!important;user-select:none;-webkit-user-drag:none;pointer-events:none}
.frame.empty .box{background:var(--ph)}
.hint-ph{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:4px;text-align:center;color:var(--ph-fg);font:500 12px/1.3 var(--f-ui);padding:6px}
.hint-ph .i{width:22px;height:22px}
@container (max-width:110px){.hint-ph span{display:none}}
@container (max-height:70px){.hint-ph span{display:none}}
.txt{width:100%;height:100%;display:grid;align-content:center;white-space:pre-wrap;line-height:1.25;overflow-wrap:anywhere;outline:0}
.txt[contenteditable="true"]{cursor:text;background:rgba(0,159,212,.08);box-shadow:inset 0 0 0 1px var(--g-guide)}
.lowres{position:absolute;left:6px;top:6px;padding:2px 7px;border-radius:5px;background:var(--warn);color:#fff;font:600 10.5px var(--f-mono);pointer-events:none}
.ia .frame{cursor:grab}
.ia .frame.empty{cursor:copy}
.ia .frame.text{cursor:move}
.ia .frame:hover::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px var(--accent-line);pointer-events:none}
.ia .frame.drop::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px var(--g-guide);background:rgba(0,159,212,.18);pointer-events:none}
.sheet.pv .frame{cursor:default}
.sheet.pv .frame:hover::after{display:none}
body.dragging,body.dragging *{cursor:grabbing!important}
.ov{position:absolute;inset:0;pointer-events:none;z-index:4}
.ov>div{position:absolute}
.g-bleed{border-style:solid;border-color:rgba(224,70,76,.13);outline:1px dashed var(--g-bleed);outline-offset:-1px}
.g-safe{border:1px dashed var(--g-safe)}
.g-gutter{background:rgba(118,87,242,.07)}
.g-fold{border-left:1px dashed var(--g-fold)}
.g-spine{background:rgba(118,87,242,.1);border-left:1px dashed var(--g-fold);border-right:1px dashed var(--g-fold)}
.g-grid{background-image:linear-gradient(to right,rgba(0,159,212,.22) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,159,212,.22) 1px,transparent 1px)}
.g-side{box-shadow:0 0 0 2px var(--accent)}
.plab{position:absolute;transform:translateX(-50%);font:600 11.5px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;padding:2px 8px;border-radius:999px}
.plab.on{background:var(--accent);color:var(--accent-ink)}
.plab.sm{font-size:10px;padding:2px 4px}
.selbox{position:absolute;box-shadow:0 0 0 2px var(--accent);pointer-events:none;transform-origin:center}
.hd{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;background:#fff;border:2px solid var(--accent);border-radius:3px;pointer-events:auto;z-index:2}
.hd::before{content:"";position:absolute;inset:-6px}
.hd-nw{left:0;top:0;cursor:nwse-resize}.hd-n{left:50%;top:0;cursor:ns-resize}.hd-ne{left:100%;top:0;cursor:nesw-resize}.hd-e{left:100%;top:50%;cursor:ew-resize}
.hd-se{left:100%;top:100%;cursor:nwse-resize}.hd-s{left:50%;top:100%;cursor:ns-resize}.hd-sw{left:0;top:100%;cursor:nesw-resize}.hd-w{left:0;top:50%;cursor:ew-resize}
.mv{position:absolute;left:50%;top:-12px;transform:translate(-50%,-100%);display:grid;place-items:center;width:30px;height:24px;border-radius:7px;background:var(--accent);color:var(--accent-ink);pointer-events:auto;cursor:move;box-shadow:var(--shadow)}
.mv .i{width:15px;height:15px}
.snaps i{position:absolute;display:block}
.snaps i.v{width:0;border-left:1px solid var(--accent)}
.snaps i.h{height:0;border-top:1px solid var(--accent)}
.guide{position:absolute;pointer-events:auto}
.guide.h{left:0;right:0;height:9px;margin-top:-4px;cursor:row-resize}
.guide.v{top:0;bottom:0;width:9px;margin-left:-4px;cursor:col-resize}
.guide::after{content:"";position:absolute;background:var(--g-guide)}
.guide.h::after{left:0;right:0;top:4px;height:1px}
.guide.v::after{top:0;bottom:0;left:4px;width:1px}

/* ---------- page strip ---------- */
.foot{display:flex;gap:12px;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-width:0}
.foot-meta{display:flex;flex-direction:column;justify-content:center;gap:7px;flex:none}
.foot-meta b{font-size:12.5px}
.foot-meta b span{font-family:var(--f-mono);color:var(--muted);font-weight:500}
#strip{position:relative;display:flex;gap:10px;overflow-x:auto;flex:1;min-width:0;padding:3px 2px}
.st{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;border-radius:8px;padding:5px 6px 3px;border:1px solid transparent}
.st:hover{background:var(--panel-2)}
.st.on{border-color:var(--accent);background:var(--accent-soft)}
.st.dropto{box-shadow:-3px 0 0 var(--g-guide)}
.st-th{position:relative;pointer-events:none}
.st-lab{font:500 11px var(--f-mono);color:var(--muted);white-space:nowrap}
.st.on .st-lab{color:var(--accent);font-weight:600}

/* ---------- toast, ghost, modal ---------- */
#toasts{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:200;pointer-events:none;width:min(560px,calc(100vw - 32px))}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);animation:tin .18s ease-out}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
#ghost{position:fixed;width:76px;height:76px;border-radius:6px;background-size:cover;background-position:center;border:3px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.35);pointer-events:none;z-index:300;transform:translate(-50%,-50%) rotate(-4deg)}
.modal{position:fixed;inset:0;z-index:150;background:var(--scrim);color:var(--scrim-fg);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding:16px}
.mh,.mf{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.mh{justify-content:space-between}
.mh b{font-family:var(--f-display);font-size:20px;font-weight:600}
.mh span,.mf span{font:500 13px var(--f-mono);opacity:.8}
.modal .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:var(--scrim-fg)}
.modal .btn:hover{background:rgba(255,255,255,.16)}
.bk-stage{display:grid;place-items:center;min-height:0}
.book{position:relative;perspective:2800px;cursor:pointer}
.bk-half{position:absolute;top:0;width:50%;height:100%;overflow:hidden}
.bk-half.l{left:0}.bk-half.r{left:50%}
.bk-half.has{box-shadow:0 18px 50px rgba(0,0,0,.5)}
.fold-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,transparent 44%,rgba(0,0,0,.10) 48.5%,rgba(0,0,0,.24) 50%,rgba(0,0,0,.10) 51.5%,transparent 56%);z-index:3}
.leaf{position:absolute;top:0;width:50%;height:100%;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.45,.05,.25,1);z-index:6}
.leaf.r{left:50%;transform-origin:left center}
.leaf.l{left:0;transform-origin:right center}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.face.has::after{content:"";position:absolute;inset:0;pointer-events:none}
.leaf.r .face.front.has::after,.leaf.l .face.back.has::after{background:linear-gradient(to right,rgba(0,0,0,.18),transparent 14%)}
.leaf.r .face.back.has::after,.leaf.l .face.front.has::after{background:linear-gradient(to left,rgba(0,0,0,.18),transparent 14%)}
.pvw{position:absolute;inset:0;overflow:hidden}

/* ---------- export dialog ---------- */
.modal.light{background:rgba(10,12,16,.5);color:var(--fg);display:grid;grid-template-rows:none;place-items:center;padding:16px}
.dlg{width:min(660px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.dlg-h b{font-family:var(--f-display);font-size:21px;font-weight:600;text-wrap:balance}
.dlg-h span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.dlg-b{padding:18px 20px 20px}
.ex-grid{display:grid;gap:14px}
.ex-row{display:grid;grid-template-columns:118px minmax(0,1fr);align-items:center;gap:6px 14px}
.ex-row .seg{justify-self:start;flex-wrap:wrap}
.ex-row .hint{grid-column:2;margin:0}
.tgl{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;font-size:12.5px;font-weight:500}
.tgl span{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none}
.tgl.on{border-color:var(--accent-line);background:var(--accent-soft)}
.tgl.on span{background:var(--accent);border-color:var(--accent)}
.tgl.on span::after{content:"";width:7px;height:3.5px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg)}
.ex-sum{display:grid;gap:3px;margin-top:18px;padding:12px 14px;border-radius:10px;background:var(--panel-2);font-size:12.5px;color:var(--muted)}
.ex-sum b{color:var(--fg);font-size:14px}
.ex-check h4{margin:18px 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ex-check ul{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:13px}
.ex-check li{position:relative;padding-left:24px;line-height:1.45}
.ex-check li::before{position:absolute;left:0;top:1px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--f-ui)}
.ex-check li.ok::before{content:"✓";color:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok)}
.ex-check li.warn::before{content:"!";color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn)}
.ex-check li.info::before{content:"i";color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.ex-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px}
.ex-done{font-size:13px;font-weight:600;color:var(--ok);min-width:0;flex:1}
.ex-done.err{color:var(--warn)}
.ex-prog{display:grid;gap:14px;justify-items:center;padding:34px 0 18px;text-align:center}
.ex-prog p{margin:0;font-size:13.5px}
.bar{width:100%;height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
@media (max-width:560px){.ex-row{grid-template-columns:1fr}.ex-row .hint{grid-column:1}}

/* ---------- file status + menu ---------- */
.fchip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font:500 12px var(--f-ui);color:var(--muted);max-width:300px;min-width:0}
.fchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fchip i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--faint)}
.fchip.warn i{background:var(--mid)} .fchip.ok i{background:var(--ok)}
.fchip:hover{border-color:var(--line-2);color:var(--fg)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:140;width:300px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.menu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;height:34px;padding:0 10px;border:0;border-radius:7px;background:none;cursor:pointer;font-size:13px;text-align:left}
.menu button:hover,.menu button:focus-visible{background:var(--panel-2)}
.menu kbd{font:500 11px var(--f-mono);color:var(--faint)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.minfo{display:grid;gap:3px;padding:6px 10px 4px;font-size:11.5px;color:var(--muted);line-height:1.4}
.minfo b{color:var(--fg);font-size:12.5px;overflow-wrap:anywhere}
.dlg.sm{width:min(440px,100%)}
.cf-t{display:block;font-family:var(--f-display);font-size:20px;font-weight:600;margin-bottom:8px}
.cf-p{margin:0 0 18px;color:var(--muted);font-size:13.5px;line-height:1.55}
@media (max-width:1400px){.hide-m{display:none}}
@media (max-width:1180px){.fchip{max-width:190px}}

@media (prefers-reduced-motion:reduce){.leaf{transition:none}.toast{animation:none}}

/* ---------- narrow screens ---------- */
@media (max-width:1180px){.main{grid-template-columns:272px minmax(0,1fr) 264px}.brand span{display:none}}
@media (max-width:960px){
  .main{grid-template-columns:minmax(0,1fr)}
  .panel.left,.panel.right{position:fixed;z-index:120;top:12px;bottom:12px;width:min(340px,calc(100vw - 32px));box-shadow:var(--shadow);transition:transform .22s ease;visibility:hidden}
  .panel.left{left:16px;transform:translateX(calc(-100% - 24px))}
  .panel.right{right:16px;transform:translateX(calc(100% + 24px))}
  .app.show-left .panel.left,.app.show-right .panel.right{transform:none;visibility:visible}
  .mob{display:inline-flex}
  .panel-h.mob{display:flex}
  .top .hide-n{display:none}
  .pnav-lab{min-width:96px}
  .pos{display:none}
  .foot{flex-direction:column}
  .foot-meta{flex-direction:row;align-items:center;flex-wrap:wrap}
  #toasts{bottom:150px}
}
@media (max-height:640px){body{overflow-y:auto}.app{height:auto;min-height:100%}.main{height:520px}}

const LAYOUTS=LAYOUT_DEF.map(([id,cat,name,o,fr])=>({id,cat,name,scope:o.scope||'page',bleed:!!o.bleed,gap:o.gap!==0,cover:!!o.cover,frames:fr.map(f=>Array.isArray(f)?{r:f}:f)}));

const CATS=[['all','Tất cả'],['1','1 ảnh'],['2','2 ảnh'],['3','3 ảnh'],['4','4 ảnh'],['5','5–6 ảnh'],['collage','Collage'],['spread','Trải đôi'],['text','Có chữ'],['cover','Bìa']];
const PRESETS=[[200,200,'Vuông nhỏ'],[250,250,'Vuông vừa'],[300,300,'Phổ biến nhất'],[350,350,'Vuông lớn'],[300,200,'Ngang'],[350,250,'Ngang lớn'],[200,300,'Dọc'],[250,350,'Dọc lớn'],[297,210,'A4 ngang'],[210,297,'A4 dọc']];
const SWATCH=['#ffffff','#f6f1e9','#ece6dc','#e8e4ef','#dfe8e3','#1e1e1e','#2c3440','#6e2b36'];
const FONTS=['Playfair Display','Cormorant Garamond','Great Vibes','Dancing Script','Montserrat','Be Vietnam Pro'];
const FB={'Playfair Display':'Georgia,serif','Cormorant Garamond':'Georgia,serif','Great Vibes':'cursive','Dancing Script':'cursive','Montserrat':'Arial,sans-serif','Be Vietnam Pro':'Arial,sans-serif'};
const PLAN=[['text-only','full'],['S','sp-full'],['2-row','3-left-big'],['full','2-row'],['4-grid','single-center'],['S','sp-big3'],['polaroid-3','quote'],['6-2x3','full'],['S','sp-8'],['mag-left','single']];
const CYCLE=[['full','2-row'],['4-grid','single'],['S','sp-big3'],['3-left-big','2-col'],['6-2x3','full'],['S','sp-full'],['2-big-top','4-mosaic']];
const ZS=[.1,.15,.2,.25,.33,.5,.67,.75,1,1.25,1.5,2,3,4];
const HANDLES=['nw','n','ne','e','se','s','sw','w'];
const ANCH={tl:'Trên trái',t:'Trên giữa',tr:'Trên phải',l:'Giữa trái',c:'Chính giữa',r:'Giữa phải',bl:'Dưới trái',b:'Dưới giữa',br:'Dưới phải'};

/* ================= trạng thái ================= */
const PH={};                               // kho ảnh: id -> {id,name,w,h,url,thumb,sample}
const S={A:{w:300,h:300,spine:12,bleed:3,safe:6,margin:12,gap:5},lib:[],spreads:[],guides:[],cur:1,sel:null};
const V={zoom:'fit',bleed:true,safe:true,fold:true,grid:false,guides:true,preview:false,tab:'photos',cat:'all',target:'L',filter:'all',
  sc:1,origin:{x:0,y:0},sheetPos:{left:0,top:0},mouse:null,alignRef:'page',last:{},editing:null,pickTarget:null};
const H={undo:[],redo:[],pending:null};

/* ================= hình học (đơn vị mm, gốc = góc trên trái mép xén của tờ) ================= */
const spineOf=(sp,A=S.A)=>sp.kind==='cover'?A.spine:0;
const spreadW=(sp,A=S.A)=>2*A.w+spineOf(sp,A);
function sideRect(sp,side,A=S.A){const s=spineOf(sp,A);
  if(side==='L') return {x:0,y:0,w:A.w,h:A.h};
  if(side==='R') return {x:A.w+s,y:0,w:A.w,h:A.h};
  if(side==='P') return {x:A.w,y:0,w:s,h:A.h};
  return {x:0,y:0,w:2*A.w+s,h:A.h};}
function contentBox(sp,side,bleed){const r=sideRect(sp,side);
  if(!bleed){const m=sp.margin; return {x:r.x+m,y:r.y+m,w:r.w-2*m,h:r.h-2*m,ext:{l:0,r:0,t:0,b:0}};}
  const b=S.A.bleed; return {x:r.x,y:r.y,w:r.w,h:r.h,ext:{l:side==='R'?0:b,r:side==='L'?0:b,t:b,b:b}};}
function rectsFor(d,box,gap){const E=1e-6;
  return d.frames.map(spec=>{const [fx,fy,fw,fh]=spec.r;
    let x0=box.x+fx*box.w,y0=box.y+fy*box.h,x1=box.x+(fx+fw)*box.w,y1=box.y+(fy+fh)*box.h;
    if(d.gap){const h2=gap/2; if(fx>E)x0+=h2; if(fx+fw<1-E)x1-=h2; if(fy>E)y0+=h2; if(fy+fh<1-E)y1-=h2;}
    if(fx<E)x0-=box.ext.l; if(fx+fw>1-E)x1+=box.ext.r; if(fy<E)y0-=box.ext.t; if(fy+fh>1-E)y1+=box.ext.b;
    return {spec,x:x0,y:y0,w:Math.max(1,x1-x0),h:Math.max(1,y1-y0)};});}
function pageSideAt(sp,x){const W=S.A.w,s=spineOf(sp); if(x<W) return 'L'; if(x>W+s) return 'R'; return 'P';}
const curSpread=()=>S.spreads[S.cur];
function pageName(sp,side){
  if(sp.kind==='cover') return {L:'Bìa sau',R:'Bìa trước',P:'Gáy',S:'Toàn bộ bìa'}[side];
  const i=S.spreads.indexOf(sp);
  return side==='L'?`Trang ${2*i-1}`:side==='R'?`Trang ${2*i}`:`Trang ${2*i-1}–${2*i}`;}

/* ================= mô hình ================= */
function mkPhoto(o){return Object.assign({id:uid(),type:'photo',side:'L',x:0,y:0,w:10,h:10,rot:0,border:0,borderColor:'#ffffff',radius:0,shadow:false,photo:null,zoom:1,panX:0,panY:0,prot:0,flip:false,fit:'fill'},o);}
function mkText(o){return Object.assign({id:uid(),type:'text',side:'L',x:0,y:0,w:10,h:10,rot:0,border:0,borderColor:'#ffffff',radius:0,shadow:false,text:'',font:'Be Vietnam Pro',size:12,color:'#222222',align:'center',bold:false,italic:false,vertical:false,ls:0},o);}
function newSpread(kind='inner'){const c=kind==='cover'?'#ece6dc':'#ffffff';
  return {id:uid('s'),kind,margin:S.A.margin,gap:S.A.gap,bg:{L:c,R:c,P:c},layout:{L:null,R:null,S:null},dirty:{L:false,R:false,S:false},frames:[]};}
const RANK={L:0,S:1,R:2,P:3};
const sortFrames=fs=>fs.map((f,i)=>[f,i]).sort((a,b)=>RANK[a[0].side]-RANK[b[0].side]||a[1]-b[1]).map(a=>a[0]);
const photoOf=f=>(f&&f.type==='photo'&&f.photo&&PH[f.photo])||null;
function setPhoto(f,id){Object.assign(f,{photo:id,zoom:1,panX:0,panY:0,prot:0,flip:false,fit:'fill'});}

function applyLayout(sp,id,target){
  const d=LBY[id]; if(!d) return; const scope=d.scope==='S'?'S':target;
  const kill=scope==='S'?['L','R','S']:[scope,'S'];
  const old=sortFrames(sp.frames.filter(f=>kill.includes(f.side)));
  const photos=old.filter(f=>photoOf(f)).map(f=>f.photo);
  const texts={}; old.filter(f=>f.type==='text'&&f.edited).forEach(f=>{(texts[f.role||'x']=texts[f.role||'x']||[]).push(f.text);});
  sp.frames=sp.frames.filter(f=>!kill.includes(f.side));
  if(scope==='S'){sp.layout.L=sp.layout.R=null; sp.layout.S=id; sp.dirty.L=sp.dirty.R=false;}
  else{ if(sp.layout.S){sp.layout.S=null; const o=scope==='L'?'R':'L'; if(!sp.frames.some(f=>f.side===o)) sp.layout[o]='blank';} sp.layout[scope]=id; }
  sp.dirty[scope]=false;
  const k=clamp(S.A.w/300,.55,1.6);
  rectsFor(d,contentBox(sp,scope,d.bleed),sp.gap).forEach((r,i)=>{const s=r.spec;
    const base={side:scope,ti:i,x:r.x,y:r.y,w:r.w,h:r.h,rot:s.rot||0,border:s.border||0,borderColor:s.borderColor||'#ffffff',shadow:!!s.shadow,radius:s.radius||0};
    if(s.t==='text'){const kept=texts[s.role]&&texts[s.role].shift();
      sp.frames.push(mkText({...base,role:s.role,text:kept??s.text,edited:kept!=null,font:s.font,size:r2(s.size*k),color:s.color,align:s.align,italic:!!s.italic,bold:!!s.bold,ls:s.ls||0}));}
    else sp.frames.push(mkPhoto({...base,photo:photos.shift()||null}));});
}
function applyPlan(sp,p){ if(p[0]==='S') applyLayout(sp,p[1],'S'); else {applyLayout(sp,p[0],'L'); applyLayout(sp,p[1],'R');} }
function fitSpine(sp){ if(sp.kind!=='cover') return; for(const f of sp.frames) if(f.side==='P'){f.x=S.A.w; f.w=Math.max(1,S.A.spine); f.y=S.A.h*.1; f.h=S.A.h*.8;} }
function relayout(sp){
  for(const sc of ['L','R','S']){const id=sp.layout[sc]; if(!id||sp.dirty[sc]) continue; const d=LBY[id];
    const rs=rectsFor(d,contentBox(sp,sc,d.bleed),sp.gap);
    for(const f of sp.frames) if(f.side===sc&&f.ti!=null&&rs[f.ti]){const r=rs[f.ti]; f.x=r.x;f.y=r.y;f.w=r.w;f.h=r.h; clampPan(f);}}
  fitSpine(sp);
}
function setAlbum(patch){
  const old={...S.A}; Object.assign(S.A,patch);
  for(const sp of S.spreads){
    for(const f of sp.frames){
      if(f.side==='P') continue;
      if(sp.dirty[f.side]||f.ti==null||!sp.layout[f.side]){
        const ro=sideRect(sp,f.side,old),rn=sideRect(sp,f.side,S.A);
        f.x=rn.x+(f.x-ro.x)*rn.w/ro.w; f.y=rn.y+(f.y-ro.y)*rn.h/ro.h; f.w*=rn.w/ro.w; f.h*=rn.h/ro.h; clampPan(f);}
      if(f.type==='text'&&old.w!==S.A.w) f.size=r2(f.size*S.A.w/old.w);
    }
    relayout(sp);
  }
  S.guides=S.guides.filter(gd=>gd.v>-50&&gd.v<(gd.a==='h'?S.A.h:2*S.A.w+S.A.spine)+50);
}
function cropGeom(f){const p=photoOf(f); if(!p) return null;
  const fw=Math.max(.5,f.w-2*f.border),fh=Math.max(.5,f.h-2*f.border),rt=(f.prot/90)%2!==0;
  const bw=rt?p.h:p.w,bh=rt?p.w:p.h,base=f.fit==='fit'?Math.min(fw/bw,fh/bh):Math.max(fw/bw,fh/bh),s=base*f.zoom;
  return {p,fw,fh,s,bbW:bw*s,bbH:bh*s};}
function clampPan(f){const q=cropGeom(f); if(!q) return; const mx=Math.abs(q.bbW-q.fw)/2/q.fw,my=Math.abs(q.bbH-q.fh)/2/q.fh;
  f.panX=clamp(f.panX,-mx,mx); f.panY=clamp(f.panY,-my,my);}
const dpiOf=f=>{const q=cropGeom(f); return q?Math.round(25.4/q.s):0;};
function reside(sp,f,old){ if(f.side==='L'||f.side==='R'){const ns=pageSideAt(sp,f.x+f.w/2); if(ns!=='P') f.side=ns;}
  if(old in sp.dirty) sp.dirty[old]=true; if(f.side in sp.dirty) sp.dirty[f.side]=true; }
function usageMap(){const u={}; for(const sp of S.spreads) for(const f of sp.frames) if(photoOf(f)) u[f.photo]=(u[f.photo]||0)+1; return u;}
function findFrame(id){for(const sp of S.spreads){const f=sp.frames.find(x=>x.id===id); if(f) return f;} return null;}
const selFrame=()=>S.sel&&S.sel.kind==='frame'?curSpread().frames.find(f=>f.id===S.sel.id)||null:null;
function autoFill(ids,addSpreads){
  const q=ids.slice(); let n=0;
  const fill=sp=>{for(const f of sortFrames(sp.frames)) if(f.type==='photo'&&!photoOf(f)&&q.length){setPhoto(f,q.shift()); n++;}};
  S.spreads.forEach(fill);
  let k=0; while(addSpreads&&q.length&&S.spreads.length<101){const sp=newSpread(); applyPlan(sp,CYCLE[k++%CYCLE.length]); S.spreads.push(sp); fill(sp);}
  return n;
}
function removeSamples(){const ids=new Set(S.lib.filter(id=>PH[id].sample)); S.lib=S.lib.filter(id=>!ids.has(id));
  for(const sp of S.spreads) for(const f of sp.frames) if(ids.has(f.photo)) f.photo=null;}
function spineFrame(){return mkText({side:'P',role:'spine',text:'ALBUM KỶ NIỆM · 2026',font:'Montserrat',size:8,color:'#3a3630',vertical:true,ls:.25});}
function initAlbum(){
  const cover=newSpread('cover'); applyLayout(cover,'cv-back','L'); applyLayout(cover,'cv-frame','R'); cover.frames.push(spineFrame()); fitSpine(cover);
  S.spreads=[cover];
  for(const p of PLAN){const sp=newSpread(); applyPlan(sp,p); S.spreads.push(sp);}
  S.cur=4;
}

/* ================= lịch sử (hoàn tác) ================= */
const snapState=()=>JSON.stringify({A:S.A,spreads:S.spreads,guides:S.guides,lib:S.lib,cur:S.cur});
function restore(s){const o=JSON.parse(s); S.A=o.A; S.spreads=o.spreads; S.guides=o.guides; S.lib=o.lib; S.cur=clamp(o.cur,0,S.spreads.length-1); S.sel=null;}
function beginEdit(){ if(!H.pending) H.pending=snapState(); }
function commit(){ if(H.pending){ if(H.pending!==snapState()){H.undo.push(H.pending); if(H.undo.length>100) H.undo.shift(); H.redo=[];} H.pending=null; } render(); }
function act(fn){ beginEdit(); fn(); commit(); }
function undo(){ if(H.pending) commit(); const s=H.undo.pop(); if(!s) return; H.redo.push(snapState()); restore(s); render(); }
function redo(){ const s=H.redo.pop(); if(!s) return; H.undo.push(snapState()); restore(s); render(); }

/* ---- 2-ve-giao-dien.js ---- */

/* ================= vẽ tờ ================= */
function placeBox(d,f,sc){Object.assign(d.style,{left:f.x*sc+'px',top:f.y*sc+'px',width:f.w*sc+'px',height:f.h*sc+'px',transform:f.rot?`rotate(${f.rot}deg)`:''});}
function styleFrame(d,f,sc){
  placeBox(d,f,sc);
  const fin=d.firstChild,bx=fin.firstChild;
  fin.style.padding=f.border*sc+'px'; fin.style.background=f.border>0?f.borderColor:'transparent';
  fin.style.borderRadius=f.radius*sc+'px'; fin.style.boxShadow=f.shadow?`0 ${.8*sc}px ${3*sc}px rgba(0,0,0,.28)`:'';
  bx.style.borderRadius=Math.max(0,f.radius-f.border)*sc+'px';
  const im=bx.querySelector('img');
  if(im){const q=cropGeom(f); if(q){im.style.width=q.p.w*q.s*sc+'px'; im.style.height=q.p.h*q.s*sc+'px';
    im.style.transform=`translate(-50%,-50%) translate(${f.panX*q.fw*sc}px,${f.panY*q.fh*sc}px) rotate(${f.prot}deg)${f.flip?' scaleX(-1)':''}`;}}
  const t=bx.querySelector('.txt');
  if(t){const s=t.style; s.fontFamily=`"${f.font}",${FB[f.font]||'serif'}`; s.fontSize=f.size*PT*sc+'px'; s.color=f.color; s.textAlign=f.align;
    s.fontWeight=f.bold?'700':'400'; s.fontStyle=f.italic?'italic':'normal'; s.letterSpacing=(f.ls||0)+'em'; s.writingMode=f.vertical?'vertical-rl':'horizontal-tb';}
}
function frameEl(f,sc,mode){
  const d=el('div','frame '+f.type); d.dataset.id=f.id;
  const fin=el('div','fin'),bx=el('div','box'); fin.append(bx); d.append(fin);
  const live=mode==='edit'&&!V.preview;
  if(f.type==='photo'){const p=photoOf(f);
    if(p){const im=document.createElement('img'); im.alt=''; im.draggable=false; im.decoding='async'; im.src=mode==='thumb'?p.thumb:p.url; bx.append(im); d.classList.add('has');
      if(live&&!p.sample){const dp=dpiOf(f); if(dp<150){const w=el('span','lowres'); w.textContent=dp+' dpi'; w.title='Độ phân giải thấp, ảnh có thể vỡ hạt khi in. Nên từ 200 dpi trở lên.'; bx.append(w);}}}
    else{d.classList.add('empty'); if(live) bx.innerHTML=`<div class="hint-ph">${ico('image')}<span>Kéo ảnh vào<br>hoặc nhấp đúp</span></div>`;}}
  else{const t=el('div','txt'); t.textContent=f.text; bx.append(t);}
  styleFrame(d,f,sc); return d;
}
function renderSheet(sp,sc,mode){
  const A=S.A,W=A.w,Hh=A.h,s=spineOf(sp),SW=spreadW(sp),b=A.bleed,edit=mode==='edit';
  const cb=(edit&&!V.preview&&V.bleed)?b:0;
  const sheet=el('div','sheet '+mode+(edit?' ia':'')+(edit&&V.preview?' pv':''));
  sheet.style.width=SW*sc+'px'; sheet.style.height=Hh*sc+'px';
  const clip=el('div','clip'); Object.assign(clip.style,{left:-cb*sc+'px',top:-cb*sc+'px',width:(SW+2*cb)*sc+'px',height:(Hh+2*cb)*sc+'px'});
  const org=el('div','org'); org.style.left=cb*sc+'px'; org.style.top=cb*sc+'px'; clip.append(org); sheet.append(clip);
  const bgs=s?[['L',-b,W+b],['P',W,s],['R',W+s,W+b]]:[['L',-b,W+b],['R',W,W+b]];
  for(const [sd,x,w] of bgs){const d=el('div','pbg'); d.dataset.side=sd;
    Object.assign(d.style,{left:x*sc+'px',top:-b*sc+'px',width:w*sc+'px',height:(Hh+2*b)*sc+'px',background:sp.bg[sd]||'#ffffff'}); org.append(d);}
  const fs=[...sp.frames].sort((a,c)=>(a.side==='P')-(c.side==='P'));
  for(const f of fs) org.append(frameEl(f,sc,mode));
  if(edit) addOverlays(sheet,sp,sc);
  return sheet;
}
function addOverlays(sheet,sp,sc){
  const A=S.A,W=A.w,Hh=A.h,s=spineOf(sp),SW=spreadW(sp),b=A.bleed;
  const ov=el('div','ov'); sheet.append(ov);
  const box=(c,x,y,w,h)=>{const d=el('div',c); Object.assign(d.style,{left:x*sc+'px',top:y*sc+'px',width:w*sc+'px',height:h*sc+'px'}); ov.append(d); return d;};
  if(!V.preview){
    if(V.grid){const d=box('g-grid',0,0,SW,Hh); d.style.backgroundSize=`${10*sc}px ${10*sc}px`;}
    if(V.fold){ if(s) box('g-spine',W,0,s,Hh); else {box('g-gutter',W-6,0,12,Hh); box('g-fold',W,0,0,Hh);} }
    if(V.safe) for(const sd of ['L','R']){const r=sideRect(sp,sd); box('g-safe',r.x+A.safe,A.safe,r.w-2*A.safe,Hh-2*A.safe);}
    if(V.bleed&&b>0){const d=box('g-bleed',-b,-b,SW+2*b,Hh+2*b); d.style.borderWidth=b*sc+'px';}
    if(S.sel&&S.sel.kind==='side'){const r=sideRect(sp,S.sel.side); box('g-side',r.x,0,r.w,Hh);}
    const f=selFrame();
    if(f){const d=el('div','selbox'); d.dataset.sel=f.id; placeBox(d,f,sc);
      d.innerHTML=HANDLES.map(h=>`<i class="hd hd-${h}" data-h="${h}"></i>`).join('')+`<b class="mv" data-mv="1" title="Kéo để di chuyển khung">${ico('move')}</b>`;
      ov.append(d);}
    const sn=el('div','snaps'); sn.id='snaps'; ov.append(sn);
  }
  const labs=s?[['L',W/2],['P',W+s/2],['R',W+s+W/2]]:[['L',W/2],['R',W+W/2]];
  for(const [sd,cx] of labs){const d=el('div','plab'+(sd==='P'?' sm':'')+(S.sel&&S.sel.kind==='side'&&S.sel.side===sd?' on':''));
    d.textContent=sd==='P'?'Gáy':pageName(sp,sd); d.style.left=cx*sc+'px'; d.style.top=(Hh+b)*sc+10+'px'; ov.append(d);}
}
const frameNode=id=>$(`#sheetWrap .frame[data-id="${id}"]`);
function restyle(f){const n=frameNode(f.id); if(n) styleFrame(n,f,V.sc); const sb=$('#sheetWrap .selbox'); if(sb&&sb.dataset.sel===f.id) placeBox(sb,f,V.sc);}
function showSnaps(lines){const c=$('#snaps'); if(!c) return; const sc=V.sc,Hh=S.A.h,SW=spreadW(curSpread()),e=S.A.bleed+8;
  c.innerHTML=lines.map(([a,v])=>a==='v'?`<i class="v" style="left:${v*sc}px;top:${-e*sc}px;height:${(Hh+2*e)*sc}px"></i>`:`<i class="h" style="top:${v*sc}px;left:${-e*sc}px;width:${(SW+2*e)*sc}px"></i>`).join('');}

/* ================= sân khấu + thước ================= */
const PAD=44,LAB=34;
function renderStage(){
  const sp=curSpread(),vp=$('#vp'),ws=$('#ws'),SW=spreadW(sp),Hh=S.A.h,b=S.A.bleed,cw=vp.clientWidth,ch=vp.clientHeight;
  let sc;
  if(V.zoom==='fit') sc=Math.max(.15,Math.min((cw-PAD*2)/(SW+2*b),(ch-PAD*2-LAB)/(Hh+2*b)));
  else sc=V.zoom*MM;
  V.sc=sc;
  const sw=SW*sc,sh=Hh*sc,bp=b*sc;
  const wsW=V.zoom==='fit'?cw:Math.max(cw,Math.ceil(sw+2*bp+PAD*2)),wsH=V.zoom==='fit'?ch:Math.max(ch,Math.ceil(sh+2*bp+PAD*2+LAB));
  ws.style.width=wsW+'px'; ws.style.height=wsH+'px';
  V.sheetPos={left:Math.round((wsW-sw)/2),top:Math.round((wsH-sh-LAB)/2)};
  const wrap=$('#sheetWrap'); wrap.style.left=V.sheetPos.left+'px'; wrap.style.top=V.sheetPos.top+'px';
  wrap.replaceChildren(renderSheet(sp,sc,'edit'));
  renderGuides(); updateOrigin(); drawRulers();
  const zl=$('#zl'); if(zl) zl.textContent=Math.round(sc/MM*100)+'%';
}
function updateOrigin(){const vp=$('#vp'); V.origin={x:V.sheetPos.left-vp.scrollLeft,y:V.sheetPos.top-vp.scrollTop};}
function renderGuides(){const L=$('#guideLayer'); L.replaceChildren(); if(!V.guides||V.preview) return;
  S.guides.forEach((gd,i)=>{const d=el('div','guide '+gd.a); d.dataset.gi=i;

function drawRulers(){drawRuler($('#rT'),true); drawRuler($('#rL'),false);}
function drawRuler(cv,hz){
  const dpr=window.devicePixelRatio||1,cw=cv.clientWidth,ch=cv.clientHeight; if(!cw||!ch) return;
  if(cv.width!==Math.round(cw*dpr)||cv.height!==Math.round(ch*dpr)){cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr);}
  const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(document.documentElement),col=k=>cs.getPropertyValue(k).trim();
  const sp=curSpread(),A=S.A,s=spineOf(sp),len=hz?cw:ch,th=hz?ch:cw,sc=V.sc,o=hz?V.origin.x:V.origin.y;
  const span=(a,b2,fill)=>{const p0=o+a*sc,p1=o+b2*sc; x.fillStyle=fill; hz?x.fillRect(p0,0,p1-p0,ch):x.fillRect(0,p0,cw,p1-p0);};
  x.fillStyle=col('--ruler'); x.fillRect(0,0,cw,ch);
  const pg=col('--ruler-page');
  if(hz){span(0,A.w,pg); span(A.w+s,2*A.w+s,pg); if(s) span(A.w,A.w+s,col('--accent-soft'));} else span(0,A.h,pg);
  const f=selFrame(); if(f&&!V.preview){const a=hz?f.x:f.y; span(a,a+(hz?f.w:f.h),col('--accent-soft'));}
  const major=[10,20,50,100,200,500].find(m=>m*sc>=42)||1000;
  const minor=[1,2,5,10,20,50,100].find(m=>m*sc>=5&&major%m===0)||major;
  const m0=Math.floor((-o/sc)/minor)*minor,m1=(len-o)/sc;
  x.strokeStyle=col('--ruler-tick'); x.lineWidth=1; x.beginPath();
  const lab=[];
  for(let m=m0;m<=m1;m+=minor){const mm=Math.round(m*1000)/1000,p=Math.round(o+mm*sc)+.5;
    const isMaj=Math.abs(mm%major)<1e-6,isHalf=!isMaj&&Math.abs(mm%(major/2))<1e-6;
    const tl=isMaj?th-5:isHalf?th*.42:th*.24;
    if(hz){x.moveTo(p,ch);x.lineTo(p,ch-tl);} else {x.moveTo(cw,p);x.lineTo(cw-tl,p);}
    if(isMaj) lab.push([p,mm]);}
  x.stroke();
  x.fillStyle=col('--ruler-fg'); x.font=`500 9.5px ${col('--f-mono')}`;
  for(const [p,mm] of lab){const t=String(Math.round(mm/10*10)/10).replace('.',',');
    if(hz){x.textAlign='left'; x.fillText(t,p+3,10);} else {x.save(); x.translate(10,p+3); x.rotate(-Math.PI/2); x.textAlign='right'; x.fillText(t,0,0); x.restore();}}
  x.strokeStyle=col('--line'); x.beginPath(); if(hz){x.moveTo(0,ch-.5);x.lineTo(cw,ch-.5);} else {x.moveTo(cw-.5,0);x.lineTo(cw-.5,ch);} x.stroke();
  if(V.mouse){const p=Math.round(o+(hz?V.mouse.x:V.mouse.y)*sc)+.5; x.strokeStyle=col('--ruler-mark'); x.lineWidth=1.5; x.beginPath();
    if(hz){x.moveTo(p,0);x.lineTo(p,ch);} else {x.moveTo(0,p);x.lineTo(cw,p);} x.stroke();}
}
function zoomTo(z,ax,ay){
  const vp=$('#vp'),sc0=V.sc; if(ax==null){ax=vp.clientWidth/2; ay=vp.clientHeight/2;}
  const mx=(ax-(V.sheetPos.left-vp.scrollLeft))/sc0,my=(ay-(V.sheetPos.top-vp.scrollTop))/sc0;
  V.zoom=z==='fit'?'fit':clamp(z,.05,4);
  renderStage();
  if(V.zoom!=='fit'){vp.scrollLeft=V.sheetPos.left+mx*V.sc-ax; vp.scrollTop=V.sheetPos.top+my*V.sc-ay;}
  updateOrigin(); drawRulers(); renderGuides(); renderViewbar();
}

function laySvg(d,sp){
  const A=S.A,fake={kind:sp.kind,margin:sp.margin,gap:sp.gap},side=d.scope==='S'?'S':V.target,r=sideRect(fake,side);
  let s=`<svg viewBox="0 0 ${r.w} ${r.h}" aria-hidden="true"><rect class="pg" x="0" y="0" width="${r.w}" height="${r.h}"/>`;
  for(const q of rectsFor(d,contentBox(fake,side,d.bleed),sp.gap)){
    const x=q.x-r.x,y=q.y,w=q.w,h=q.h,rot=q.spec.rot?` transform="rotate(${q.spec.rot} ${x+w/2} ${y+h/2})"`:'';
    if(q.spec.t==='text'){const n=q.spec.role==='body'?3:1,lh=Math.min(h/(n*2.2),A.h*.028); let ty=y+h/2-(n*lh*1.8-lh*.8)/2;
      for(let k=0;k<n;k++){const lw=w*(n>1?(k===n-1?.55:.95):.7),lx=q.spec.align==='left'?x:x+(w-lw)/2; s+=`<rect class="tx" x="${lx}" y="${ty}" width="${lw}" height="${lh}" rx="${lh/2}"/>`; ty+=lh*1.8;}}
    else s+=`<rect class="${q.spec.border?'pol':'fr'}" x="${x}" y="${y}" width="${w}" height="${h}"${rot}/>`;
  }
  if(d.scope==='S') s+=sp.kind==='cover'?`<rect class="spn" x="${A.w}" y="0" width="${A.spine}" height="${A.h}"/>`:`<line class="fd" x1="${A.w}" y1="0" x2="${A.w}" y2="${A.h}" vector-effect="non-scaling-stroke"/>`;
  return s+'</svg>';
}

function drag(e,onMove,onUp){const id=e.pointerId;
  const mv=ev=>{if(ev.pointerId===id) onMove(ev);};
  const up=ev=>{if(ev.pointerId!==id) return; window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up); onUp(ev);};
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);}
function setMouse(ev){const r=$('#vp').getBoundingClientRect(); V.mouse={x:(ev.clientX-r.left-V.origin.x)/V.sc,y:(ev.clientY-r.top-V.origin.y)/V.sc}; const p=$('#pos'); if(p) p.textContent=posText(); schedRulers();}
function snapTargets(sp,f){
  const A=S.A,Hh=A.h,SW=spreadW(sp),m=sp.margin,x=[0,SW,SW/2,-A.bleed,SW+A.bleed],y=[0,Hh,Hh/2,m,Hh-m,-A.bleed,Hh+A.bleed];
  for(const sd of ['L','R']){const r=sideRect(sp,sd); x.push(r.x,r.x+r.w,r.x+r.w/2,r.x+m,r.x+r.w-m);}
  for(const gd of S.guides)(gd.a==='v'?x:y).push(gd.v);
  for(const o of sp.frames) if(o!==f&&!o.rot&&o.side!=='P'){x.push(o.x,o.x+o.w,o.x+o.w/2); y.push(o.y,o.y+o.h,o.y+o.h/2);}
  return {x,y};}
function snap1(c,vals,thr){let best=null; for(const v of vals) for(const t of c){const d=t-v; if(Math.abs(d)<=thr&&(!best||Math.abs(d)<Math.abs(best.d))) best={d,c:t};} return best;}
let ghostOn=false;
function ghost(src,ev){const gEl=$('#ghost'); if(!src){gEl.hidden=true; ghostOn=false; return;} gEl.style.backgroundImage=`url("${src}")`; gEl.hidden=false; ghostOn=true; if(ev) moveGhost(ev);}
function moveGhost(ev){const gEl=$('#ghost'); gEl.style.left=ev.clientX+'px'; gEl.style.top=ev.clientY+'px';}
function setDrop(n){$$('#sheetWrap .frame.drop').forEach(x=>{if(x!==n) x.classList.remove('drop');}); if(n) n.classList.add('drop');}
function dragPan(e,f){
  const sx=e.clientX,sy=e.clientY,p0={x:f.panX,y:f.panY},a=-f.rot*Math.PI/180,ca=Math.cos(a),sa=Math.sin(a); let moved=false,swapping=false,target=null;
  drag(e,ev=>{
    const dx=ev.clientX-sx,dy=ev.clientY-sy; if(!moved&&Math.hypot(dx,dy)<3) return;
    if(!moved){moved=true; beginEdit(); document.body.classList.add('dragging');}
    const n=frameNode(f.id),r=n&&n.getBoundingClientRect();
    const out=r&&(ev.clientX<r.left-14||ev.clientX>r.right+14||ev.clientY<r.top-14||ev.clientY>r.bottom+14);
    if(out&&!swapping){swapping=true; f.panX=p0.x; f.panY=p0.y; restyle(f); ghost(photoOf(f).thumb,ev);}
    else if(!out&&swapping){swapping=false; ghost(null); setDrop(null); target=null;}
    if(swapping){moveGhost(ev); const t=document.elementFromPoint(ev.clientX,ev.clientY); const fn=t&&t.closest('#sheetWrap .frame.photo'); target=fn&&fn.dataset.id!==f.id?fn:null; setDrop(target); return;}
    const q=cropGeom(f); if(!q) return;
    f.panX=p0.x+(dx*ca-dy*sa)/(q.fw*V.sc); f.panY=p0.y+(dx*sa+dy*ca)/(q.fh*V.sc); clampPan(f); restyle(f);
  },()=>{
    document.body.classList.remove('dragging'); ghost(null); setDrop(null);
    if(!moved) return;
    if(swapping&&target){const o=curSpread().frames.find(x=>x.id===target.dataset.id); if(o){const a1=f.photo; setPhoto(f,o.photo); setPhoto(o,a1); if(!f.photo) f.photo=null;}}
    commit();
  });
}
function dragMove(e,f){
  const sp=curSpread(),sx=e.clientX,sy=e.clientY,x0=f.x,y0=f.y,old=f.side; let moved=false;
  drag(e,ev=>{
    const dx=(ev.clientX-sx)/V.sc,dy=(ev.clientY-sy)/V.sc; if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<3) return;
    if(!moved){moved=true; beginEdit();}
    let nx=x0+dx,ny=y0+dy; const lines=[];
    if(!ev.altKey&&f.side!=='P'){const t=snapTargets(sp,f),thr=7/V.sc;
      const a=snap1(t.x,[nx,nx+f.w/2,nx+f.w],thr); if(a){nx+=a.d; lines.push(['v',a.c]);}
      const b=snap1(t.y,[ny,ny+f.h/2,ny+f.h],thr); if(b){ny+=b.d; lines.push(['h',b.c]);}}
    f.x=nx; f.y=ny; restyle(f); showSnaps(lines); setMouse(ev);
  },()=>{showSnaps([]); if(!moved) return; reside(sp,f,old); commit();});
}
function dragResize(e,f,h){
  const sp=curSpread(),sx=e.clientX,sy=e.clientY,o={x:f.x,y:f.y,w:f.w,h:f.h},ar=o.w/o.h,MIN=5; let moved=false;
  drag(e,ev=>{
    const dx=(ev.clientX-sx)/V.sc,dy=(ev.clientY-sy)/V.sc; if(!moved){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<2) return; moved=true; beginEdit();}
    let x0=o.x,y0=o.y,x1=o.x+o.w,y1=o.y+o.h; const lines=[];
    if(h.includes('w')) x0+=dx; if(h.includes('e')) x1+=dx; if(h.includes('n')) y0+=dy; if(h.includes('s')) y1+=dy;
    if(!ev.altKey){const t=snapTargets(sp,f),thr=7/V.sc,tryS=(arr,v,ax)=>{const r=snap1(arr,[v],thr); if(r){lines.push([ax,r.c]); return v+r.d;} return v;};
      if(h.includes('w')) x0=tryS(t.x,x0,'v'); if(h.includes('e')) x1=tryS(t.x,x1,'v'); if(h.includes('n')) y0=tryS(t.y,y0,'h'); if(h.includes('s')) y1=tryS(t.y,y1,'h');}
    if(x1-x0<MIN){if(h.includes('w')) x0=x1-MIN; else x1=x0+MIN;} if(y1-y0<MIN){if(h.includes('n')) y0=y1-MIN; else y1=y0+MIN;}
    if(ev.shiftKey&&h.length===2){const hh=(x1-x0)/ar; if(h.includes('n')) y0=y1-hh; else y1=y0+hh;}
    Object.assign(f,{x:x0,y:y0,w:x1-x0,h:y1-y0}); clampPan(f); restyle(f); showSnaps(lines); schedRulers();
  },()=>{showSnaps([]); if(!moved) return; reside(sp,f,f.side); commit();});
}
function guideDrag(e,gd,isNew){
  const vp=$('#vp'); let inList=!isNew; beginEdit(); V.guides=true;
  drag(e,ev=>{const r=vp.getBoundingClientRect(),inside=ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom;
    let v=gd.a==='h'?(ev.clientY-r.top-V.origin.y)/V.sc:(ev.clientX-r.left-V.origin.x)/V.sc;
    gd.v=ev.shiftKey?Math.round(v/10)*10:Math.round(v*2)/2;
    if(inside&&!inList){S.guides.push(gd); inList=true;} else if(!inside&&inList){S.guides.splice(S.guides.indexOf(gd),1); inList=false;}
    renderGuides(); setMouse(ev); const p=$('#pos'); if(p) p.textContent=`Đường gióng ${gd.a==='h'?'Y':'X'} = ${fmtcm(gd.v)} cm`;
  },()=>commit());
}
function onDouble(f){
  if(f.type==='photo'&&!photoOf(f)){pickFiles(f.id); return;}
  if(f.type!=='text') return;

function bindStage(){
  const ws=$('#ws'),vp=$('#vp');
  ws.addEventListener('pointerdown',e=>{
    if(e.button!==0||V.preview) return;
    const t=e.target;
    if(V.editing&&t.closest('.txt[contenteditable="true"]')) return;
    const hd=t.closest('[data-h]'),mv=t.closest('[data-mv]');
    if(hd||mv){const f=selFrame(); if(!f) return; e.preventDefault(); return hd?dragResize(e,f,hd.dataset.h):dragMove(e,f);}
    const gEl=t.closest('.guide'); if(gEl){e.preventDefault(); return guideDrag(e,S.guides[+gEl.dataset.gi],false);}
    const fn=t.closest('.frame');
    if(fn){const f=curSpread().frames.find(x=>x.id===fn.dataset.id); if(!f) return; e.preventDefault();
      if(document.activeElement&&document.activeElement!==document.body) document.activeElement.blur();
      const now=performance.now(),dbl=V.last.id===f.id&&now-V.last.t<380; V.last={id:f.id,t:now};

    const f=selFrame(); if(!f||!photoOf(f)||V.preview) return; const n=e.target.closest&&e.target.closest('.frame'); if(!n||n.dataset.id!==f.id) return;

  $('#rL').addEventListener('pointerdown',e=>{if(e.button===0&&!V.preview){e.preventDefault(); guideDrag(e,{a:'v',v:0},true);}});

  ws.addEventListener('dragover',e=>{const ty=[...e.dataTransfer.types]; if(!ty.includes('text/x-pid')&&!ty.includes('Files')) return; e.preventDefault(); e.dataTransfer.dropEffect='copy'; setDrop(e.target.closest('#sheetWrap .frame.photo'));});

function applyInput(e){
  const k=e.dataset.k,v=e.type==='checkbox'?e.checked:e.value,n=parseFloat(v),sp=curSpread(),f=selFrame();
  switch(k){
    case 'margin': if(isFinite(n)){sp.margin=n; relayout(sp);} break;
    case 'gap': if(isFinite(n)){sp.gap=n; relayout(sp);} break;
    case 'bg': sp.bg[e.dataset.side]=v; break;
    case 'zoom': if(f&&isFinite(n)){f.zoom=n/100; clampPan(f);} break;
    case 'border': if(f&&isFinite(n)){f.border=n; clampPan(f);} break;
    case 'borderColor': if(f) f.borderColor=v; break;
    case 'radius': if(f&&isFinite(n)) f.radius=n; break;
    case 'rot': if(f&&isFinite(n)) f.rot=n; break;
    case 'shadow': if(f) f.shadow=v; break;
    case 'gx': case 'gy': case 'gw': case 'gh': if(f&&isFinite(n)){const key=k[1]; f[key]=key==='w'||key==='h'?Math.max(5,n*10):n*10; clampPan(f); reside(sp,f,f.side);} break;
    case 'text': if(f){f.text=v; f.edited=true;} break;
    case 'font': if(f) f.font=v; break;
    case 'size': if(f&&n>0) f.size=n; break;
    case 'color': if(f) f.color=v; break;
    case 'vertical': if(f) f.vertical=v; break;
    case 'aw': if(n>0) setAlbum({w:clamp(Math.round(n*100)/10,80,800)}); break;
    case 'ah': if(n>0) setAlbum({h:clamp(Math.round(n*100)/10,80,800)}); break;
    case 'spine': if(isFinite(n)) setAlbum({spine:clamp(n,0,80)}); break;
    case 'bleed': if(isFinite(n)) setAlbum({bleed:clamp(n,0,15)}); break;
    case 'safe': if(isFinite(n)) S.A.safe=clamp(n,0,40); break;
    case 'amargin': if(isFinite(n)) S.A.margin=clamp(n,0,60); break;
    case 'agap': if(isFinite(n)) S.A.gap=clamp(n,0,30); break;
  }
}
const isLive=e=>e.type==='range'||e.type==='color'||e.tagName==='TEXTAREA';
function bindControls(){
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-act]');
    if(b){const fn=ACT[b.dataset.act]; if(fn){e.preventDefault(); fn(b.dataset.arg,b);} return;}
    const th=e.target.closest('.th'); if(th){clickLibPhoto(th.dataset.pid); return;}
    const st=e.target.closest('.st'); if(st) go(+st.dataset.idx);
  });
  document.addEventListener('input',e=>{const t=e.target; if(!t.dataset||!t.dataset.k||!isLive(t)) return; beginEdit(); applyInput(t); renderStage();
    if(t.type==='range'){const o=t.closest('.rg')&&t.closest('.rg').querySelector('output'); if(o) o.textContent=fmt1(+t.value)+' '+t.dataset.unit;}});
  document.addEventListener('change',e=>{const t=e.target; if(!t.dataset||!t.dataset.k) return; if(!isLive(t)){beginEdit(); applyInput(t);} commit();});
  $('#file').addEventListener('change',e=>{const fs=e.target.files; if(fs&&fs.length) addFiles(fs,V.pickTarget); V.pickTarget=null;});
  document.addEventListener('keydown',e=>{
    if(!$('#bookModal').hidden){if(e.key==='Escape') closeBook(); else if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault(); bookGo(1);} else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault(); bookGo(-1);} return;}
    const a=document.activeElement,typing=a&&(a.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
    if(typing){if(e.key==='Escape') a.blur(); return;}
    const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
    if(mod&&k==='z'){e.preventDefault(); e.shiftKey?redo():undo(); return;}
    if(mod&&k==='y'){e.preventDefault(); redo(); return;}
    if(mod&&k==='d'){if(selFrame()){e.preventDefault(); ACT.frameDup();} return;}
    if(mod) return;
    const f=selFrame();
    if(e.key==='Delete'||e.key==='Backspace'){if(f){e.preventDefault(); if(photoOf(f)) ACT.photoRemove(); else ACT.frameDel();} return;}
    if(e.key.startsWith('Arrow')){e.preventDefault();
      if(f){const st=e.shiftKey?10:1,sp=curSpread(); act(()=>{if(e.key==='ArrowLeft') f.x-=st; if(e.key==='ArrowRight') f.x+=st; if(e.key==='ArrowUp') f.y-=st; if(e.key==='ArrowDown') f.y+=st; reside(sp,f,f.side);});}
      else if(e.key==='ArrowLeft') go(S.cur-1); else if(e.key==='ArrowRight') go(S.cur+1);
      return;}
    if(e.key==='PageUp'){e.preventDefault(); go(S.cur-1);} else if(e.key==='PageDown'){e.preventDefault(); go(S.cur+1);}
    else if(e.key==='Escape'){if(V.preview) ACT.preview(); else if(S.sel) select(null); ACT.closePanels();}
  });
}

  x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath();}
function wrapLines(x,text,maxW){const out=[];

      let part=''; for(const ch of wd){if(part&&x.measureText(part+ch).width>maxW){out.push(part); part=ch;} else part+=ch;} line=part;}
    out.push(line);}

async function tagDpi(blob,ext,dpi){
  const u=new Uint8Array(await blob.arrayBuffer());
  if(ext==='jpg'){ if(u[0]!==0xFF||u[1]!==0xD8) return blob;
    if(u[2]===0xFF&&u[3]===0xE0&&u[6]===0x4A&&u[7]===0x46&&u[8]===0x49&&u[9]===0x46){u[13]=1; u[14]=dpi>>8; u[15]=dpi&255; u[16]=dpi>>8; u[17]=dpi&255; return new Blob([u],{type:'image/jpeg'});}
    return new Blob([u.subarray(0,2),new Uint8Array([0xFF,0xE0,0,16,0x4A,0x46,0x49,0x46,0,1,1,1,dpi>>8,dpi&255,dpi>>8,dpi&255,0,0]),u.subarray(2)],{type:'image/jpeg'});}
  if(u[12]!==0x49||u[13]!==0x48||u[14]!==0x44||u[15]!==0x52) return blob;

  return new Blob([u.subarray(0,33),ch,u.subarray(33)],{type:'image/png'});
}
function buildPDF(pages){

  parts.push(new Uint8Array([0x25,0x50,0x44,0x46,0x2D,0x31,0x2E,0x34,0x0A,0x25,0xE2,0xE3,0xCF,0xD3,0x0A])); pos+=15;
  offs[1]=pos; s('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offs[2]=pos; s(`2 0 obj\n<< /Type /Pages /Count ${N} /Kids [${pages.map((_,i)=>`${3+i*3} 0 R`).join(' ')}] >>\nendobj\n`);
  pages.forEach((pg,i)=>{const n=3+i*3,m=pg.meta,W=pt(m.mmW),H=pt(m.mmH),box=o=>`${pt(o)} ${pt(o)} ${pt(m.mmW-o)} ${pt(m.mmH-o)}`;
    offs[n]=pos; s(`${n} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /BleedBox [${box(m.sl)}] /TrimBox [${box(m.e)}] /Resources << /XObject << /Im${i} ${n+2} 0 R >> >> /Contents ${n+1} 0 R >>\nendobj\n`);
    const cs=`q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;
    offs[n+1]=pos; s(`${n+1} 0 obj\n<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
    offs[n+2]=pos; s(`${n+2} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${m.w} /Height ${m.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.blob.size} >>\nstream\n`);
    parts.push(pg.blob); pos+=pg.blob.size; s('\nendstream\nendobj\n');});
  const info=3+N*3; offs[info]=pos;
  s(`${info} 0 obj\n<< /Producer (Xuong Photobook) /Title (Album ${String(S.A.w/10)}x${String(S.A.h/10)} cm) /CreationDate (D:${ts}) >>\nendobj\n`);
  const xref=pos,total=info+1; let t=`xref\n0 ${total}\n0000000000 65535 f \n`;

  const m=$('#confirmModal'); $('#cfTitle').textContent=title; $('#cfText').textContent=text; $('#cfOk').textContent=okLabel; m.hidden=false; $('#cfOk').focus();
  const done=v=>{m.hidden=true; $('#cfOk').onclick=$('#cfCancel').onclick=null; m.onkeydown=null; res(v);};

const hasUnsaved=()=>FILE.dirty&&(H.undo.length>0||S.lib.some(id=>PH[id]&&!PH[id].sample));

/* ---- file album .pbook (ZIP: project.json + ảnh gốc) ---- */
async function projectBlob(){
  const photos={},files=[];
  for(const id of referencedIds(S.spreads,S.lib)){const p=PH[id]; if(!p) continue;
    const blob=p.file||await (await fetch(p.url)).blob(),ext=((p.name.match(/\.(jpe?g|png|webp|gif|bmp|avif)$/i)||[0,'jpg'])[1]).toLowerCase(),path=`photos/${id}.${ext}`;
    photos[id]={name:p.name,w:p.w,h:p.h,sample:!!p.sample,type:blob.type||'',path}; files.push({name:path,blob,crc:p.crc??null,pid:id});}
  const proj={app:'xuong-photobook',format:1,version:PB_VERSION,savedAt:new Date().toISOString(),A:S.A,spreads:S.spreads,guides:S.guides,lib:S.lib,cur:S.cur,photos};
  const z=await buildZip([{name:'project.json',blob:new Blob([JSON.stringify(proj)],{type:'application/json'})},...files]);
  for(const f of files) if(PH[f.pid]) PH[f.pid].crc=f.crc;
  saveCrcs(); return z;
}
const pbookName=()=>`${albumTitle()==='Album chưa đặt tên'?`Album_${S.A.w/10}x${S.A.h/10}cm_${new Date().toISOString().slice(0,10)}`:albumTitle()}.pbook`;
async function writeHandle(h,blob){const w=await h.createWritable(); await w.write(blob); await w.close();}
async function saveProject(saveAs){
  if(FILE.busy) return; if(document.activeElement&&document.activeElement!==document.body) document.activeElement.blur();
  let handle=saveAs?null:FILE.handle,mode='download';
  try{
    if(handle){ if(handle.queryPermission&&(await handle.queryPermission({mode:'readwrite'}))!=='granted'&&(await handle.requestPermission({mode:'readwrite'}))!=='granted') handle=null; else mode='handle'; }
    if(!handle&&window.showSaveFilePicker){ try{handle=await window.showSaveFilePicker({suggestedName:pbookName(),types:[{description:'Album Xưởng Photobook',accept:{'application/octet-stream':['.pbook']}}]}); mode='handle';}
      catch(e){ if(e&&e.name==='AbortError') return; handle=null; } }
  }catch(e){handle=null; mode='download';}
  FILE.busy=true; const t=toast('Đang lưu album…',{sticky:true});
  try{
    const blob=await projectBlob(); let name;
    if(mode==='handle'&&handle){await writeHandle(handle,blob); FILE.handle=handle; name=handle.name; kvSet('handle',handle);}
    else{ const inViewer=!!window.claude; name=inViewer?pbookName()+'.zip':pbookName(); const r=await saveFile(blob,name); if(!r.ok){t.close(); FILE.busy=false; toast(r.msg,{ms:7000}); return;} }
    FILE.name=name; FILE.savedHash=contentHash(); t.close(); updateDirty(); persistNow();
    toast(`Đã lưu ${name} (${fmtMB(blob.size)}).${mode==='handle'?' Lần sau bấm Ctrl+S sẽ ghi đè đúng file này.':''}`,{ms:6000});
  }catch(e){t.close(); toast('Không lưu được album: '+((e&&e.message)||e)+'.',{ms:8000});}
  FILE.busy=false;
}
async function readZip(file){
  const tl=Math.min(file.size,65557),tail=new Uint8Array(await file.slice(file.size-tl).arrayBuffer()); let eo=-1;
  for(let i=tail.length-22;i>=0;i--) if(tail[i]===0x50&&tail[i+1]===0x4b&&tail[i+2]===5&&tail[i+3]===6){eo=i; break;}
  if(eo<0) throw new Error('đây không phải file album .pbook');
  const dv=new DataView(tail.buffer),cnt=dv.getUint16(eo+10,true),cdSize=dv.getUint32(eo+12,true),cdOff=dv.getUint32(eo+16,true);
  const cb=await file.slice(cdOff,cdOff+cdSize).arrayBuffer(),cd=new DataView(cb),dec=new TextDecoder(),out={}; let p=0;
  for(let i=0;i<cnt&&p+46<=cb.byteLength;i++){ if(cd.getUint32(p,true)!==0x02014b50) break;
    const method=cd.getUint16(p+10,true),csz=cd.getUint32(p+20,true),nl=cd.getUint16(p+28,true),xl=cd.getUint16(p+30,true),cl=cd.getUint16(p+32,true),lo=cd.getUint32(p+42,true);
    const name=dec.decode(new Uint8Array(cb,p+46,nl)),lh=new DataView(await file.slice(lo,lo+30).arrayBuffer()),ds=lo+30+lh.getUint16(26,true)+lh.getUint16(28,true);
    let blob=file.slice(ds,ds+csz);
    if(method===8) blob=await new Response(blob.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob();
    else if(method!==0) throw new Error('file nén theo kiểu không hỗ trợ');
    out[name]=blob; p+=46+nl+xl+cl;}
  return out;
}
async function openProject(file,handle){
  if(hasUnsaved()&&!(await confirmDlg('Mở album khác?','Album đang làm có thay đổi chưa lưu ra file. Mở album khác sẽ thay thế nó, kể cả bản tự lưu tạm.','Mở album'))) return;
  const t=toast('Đang mở album…',{sticky:true});
  try{
    const ent=await readZip(file); if(!ent['project.json']) throw new Error('trong file không có project.json');
    const pj=JSON.parse(await ent['project.json'].text());
    if(pj.app!=='xuong-photobook'||!Array.isArray(pj.spreads)) throw new Error('file này không phải album của Xưởng Photobook');
    const ids=Object.keys(pj.photos||{}); let done=0,next=0,miss=0;
    const work=async()=>{while(next<ids.length){const id=ids[next++],m=pj.photos[id],b=ent[m.path];
      if(!b){miss++; continue;}
      try{const p=await photoFromBlob(id,m,new Blob([b],{type:m.type||'image/jpeg'}),null,null); await materialize(p,true);}catch(e){miss++;}
      t.set(`Đang mở album… ${++done}/${ids.length} ảnh`);}};
    await Promise.all([work(),work(),work()]);
    S.A=pj.A; S.spreads=pj.spreads; S.guides=pj.guides||[]; S.lib=(pj.lib||[]).filter(id=>PH[id]); S.cur=clamp(pj.cur||1,0,S.spreads.length-1);
    S.sel=null; H.undo=[]; H.redo=[]; H.pending=null; V.zoom='fit';
    FILE.handle=handle||null; FILE.name=file.name; FILE.savedHash=contentHash(); kvSet('handle',FILE.handle);
    t.close(); render(); await persistNow(); gcPhotos();
    toast(`Đã mở ${file.name}: ${S.lib.length} ảnh, ${S.spreads.length-1} tờ.${miss?` ${miss} ảnh trong file bị hỏng nên bỏ qua.`:''}`,{ms:6000});
  }catch(e){t.close(); toast('Không mở được file: '+((e&&e.message)||e)+'.',{ms:8000});}
}

let _pu=0;
async function pollUpdate(){
  try{const r=await (await fetch('/__pb_update',{cache:'no-store'})).json(); UPDS.state=r.state;
    if(r.state==='ready'&&r.version>PB_VERSION){
      toast(`Đã tải xong phiên bản mới ${r.version} từ GitHub.`,{sticky:true,action:'Cập nhật ngay',onAction:async()=>{await persistNow(); location.reload();}});
      return;}
    if(r.state!=='checking') return;}
  catch(e){}
  if(++_pu<40) setTimeout(pollUpdate,3000);
}

/* ================= xem dạng sách (lật trang) ================= */
const B={i:0,views:[],anim:false,sc:1};
function bookViews(){const cv=S.spreads[0],v=[{R:[cv,'R'],lab:'Bìa trước'}];
  for(let i=1;i<S.spreads.length;i++){const sp=S.spreads[i]; v.push({L:[sp,'L'],R:[sp,'R'],lab:`Trang ${2*i-1}–${2*i}`});}
  v.push({L:[cv,'L'],lab:'Bìa sau'}); return v;}
function pageView(ref){const d=el('div','pvw'); if(!ref) return d; const [sp,side]=ref,r=sideRect(sp,side),sh=renderSheet(sp,B.sc,'view');
  sh.style.position='absolute'; sh.style.left=-r.x*B.sc+'px'; sh.style.top='0'; d.append(sh); return d;}
function half(cls,ref){const d=el('div','bk-half '+cls+(ref?' has':'')); d.append(pageView(ref)); return d;}
function bookSize(){const st=$('#bkStage'),W=S.A.w,Hh=S.A.h; B.sc=Math.max(.2,Math.min((st.clientWidth-24)/(2*W),(st.clientHeight-12)/Hh));
  const bk=$('#book'); bk.style.width=2*W*B.sc+'px'; bk.style.height=Hh*B.sc+'px';}
function bookRender(){const bk=$('#book'),v=B.views[B.i]; bookSize(); bk.replaceChildren(half('l',v.L),half('r',v.R));
  if(v.L&&v.R) bk.append(el('div','fold-shade'));
  $('#bkLab').textContent=v.lab; $('#bkCount').textContent=`${B.i+1} / ${B.views.length}`;}
function openBook(){B.views=bookViews(); B.i=S.cur===0?0:S.cur; B.anim=false; $('#bookModal').hidden=false; bookRender();}
function closeBook(){$('#bookModal').hidden=true; $('#book').replaceChildren();}
function bookGo(dir){
  if(B.anim) return; const j=B.i+dir; if(j<0||j>=B.views.length) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){B.i=j; bookRender(); return;}
  const a=B.views[B.i],b=B.views[j],bk=$('#book'); bookSize();
  const leaf=el('div','leaf '+(dir>0?'r':'l')),fr=el('div','face front'),bkf=el('div','face back');
  const front=dir>0?a.R:a.L,back=dir>0?b.L:b.R;
  if(front){fr.classList.add('has'); fr.append(pageView(front));} if(back){bkf.classList.add('has'); bkf.append(pageView(back));}
  leaf.append(fr,bkf);
  bk.replaceChildren(dir>0?half('l',a.L):half('l',b.L),dir>0?half('r',b.R):half('r',a.R),leaf);
  B.anim=true; let done=false;
  const fin=()=>{if(done) return; done=true; B.i=j; B.anim=false; bookRender();};
  leaf.addEventListener('transitionend',fin,{once:true}); setTimeout(fin,1300);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{leaf.style.transform=`rotateY(${dir>0?-180:180}deg)`;}));
}

/* ================= thông báo ================= */
function toast(msg,o={}){const t=el('div','toast'),s=el('span'); s.textContent=msg; t.append(s);
  if(o.action){const b=el('button'); b.textContent=o.action; b.onclick=()=>{o.onAction(); t.remove();}; t.append(b);}
  $('#toasts').append(t); while($('#toasts').children.length>3) $('#toasts').firstChild.remove();
  if(!o.sticky) setTimeout(()=>t.remove(),o.ms||4200);
  return {set:m=>{s.textContent=m;},close:()=>t.remove()};}

/* ================= nạp ảnh ================= */
function pickFiles(target){const inp=$('#file'); inp.value=''; inp.multiple=!target; V.pickTarget=target; inp.click();}
const loadImg=src=>new Promise((res,rej)=>{const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src;});
function scaled(src,max,w,h){const k=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(h*k)); const x=c.getContext('2d');
  x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(src,0,0,c.width,c.height); return c;}
async function ingest(file){const src=URL.createObjectURL(file);
  try{const im=await loadImg(src),w=im.naturalWidth,h=im.naturalHeight; if(!w||!h) throw new Error('empty');
    const prevBlob=Math.max(w,h)>2400?await toBlob(scaled(im,2400,w,h),.9):null,thumbBlob=await toBlob(scaled(im,360,w,h),.82);
    if(prevBlob) URL.revokeObjectURL(src);
    const id=uid('p'); PH[id]={id,name:file.name,w,h,url:prevBlob?URL.createObjectURL(prevBlob):src,thumb:URL.createObjectURL(thumbBlob),file,prevBlob,thumbBlob};
    await materialize(PH[id],false); return id;}
  catch(err){URL.revokeObjectURL(src); return null;}}
async function addFiles(list,targetId){
  const files=[...list].filter(f=>(f.type||'').startsWith('image/')||/\.(jpe?g|png|webp|gif|bmp|avif|heic|heif)$/i.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  if(!files.length){toast('Không thấy file ảnh nào. Hãy chọn ảnh JPG, PNG hoặc WebP.'); return;}
  const t=toast(`Đang nạp ảnh 0/${files.length}…`,{sticky:true}),out=new Array(files.length); let done=0,next=0;
  const work=async()=>{while(next<files.length){const i=next++; out[i]=await ingest(files[i]); t.set(`Đang nạp ảnh ${++done}/${files.length}…`);}};
  await Promise.all([work(),work(),work()]); t.close();
  const ids=out.filter(Boolean),bad=files.length-ids.length;
  if(!ids.length){toast('Không đọc được ảnh nào. Ảnh HEIC của iPhone cần đổi sang JPG trước khi thêm.',{ms:7000}); return;}
  const hadSamples=S.lib.some(id=>PH[id]&&PH[id].sample); let placed=0;
  beginEdit();
  if(hadSamples) removeSamples();
  S.lib.push(...ids);
  if(targetId){const f=findFrame(targetId); if(f){setPhoto(f,ids[0]); placed=1;}}
  else if(hadSamples||!S.spreads.some(sp=>sp.frames.some(f=>photoOf(f)))) placed=autoFill(ids,false);
  V.tab='photos'; commit();
  let msg=`Đã thêm ${ids.length} ảnh${hadSamples?' thay cho ảnh mẫu':''}.`;
  if(!targetId){if(placed) msg+=` Đã đặt ${placed} ảnh vào khung trống.`; const left=ids.length-placed; if(left>0) msg+=` Còn ${left} ảnh trong thư viện, bấm “Tự động xếp” để thêm tờ.`;}
  if(bad) msg+=` Bỏ qua ${bad} file không đọc được.`;
  toast(msg,{ms:7000});
}

  const dims=[[1500,1000],[1000,1500],[1300,1300]][[0,0,1,0,2,0,1,0,0,1,0,2,0,0,1,0][i%16]],[w,h]=dims;

  const P=SKY[i%SKY.length]; let gr=x.createLinearGradient(0,0,0,h); gr.addColorStop(0,P[0]); gr.addColorStop(.72,P[1]); x.fillStyle=gr; x.fillRect(0,0,w,h);
  const sx=w*(.2+R()*.6),sy=h*(.16+R()*.22),sr=Math.min(w,h)*(.05+R()*.04);
  gr=x.createRadialGradient(sx,sy,0,sx,sy,sr*6); gr.addColorStop(0,P[2]); gr.addColorStop(.16,P[2]); gr.addColorStop(.19,rgba(P[2],.45)); gr.addColorStop(1,rgba(P[2],0)); x.fillStyle=gr; x.fillRect(0,0,w,h);
  P[3].forEach((cl,k)=>{const base=h*(.5+k*.13+R()*.05),amp=h*(.04+R()*.07),f1=1+R()*2.5,f2=3+R()*4,ph=R()*6;
    x.beginPath(); x.moveTo(0,h); for(let X=0;X<=w;X+=6){const t=X/w; x.lineTo(X,base-amp*Math.sin(t*Math.PI*f1+ph)-amp*.35*Math.sin(t*Math.PI*f2+ph*2));}
    x.lineTo(w,h); x.closePath(); x.fillStyle=cl; x.fill();});
  gr=x.createRadialGradient(w/2,h/2,Math.min(w,h)*.35,w/2,h/2,Math.max(w,h)*.78); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.26)'); x.fillStyle=gr; x.fillRect(0,0,w,h);
  x.font=`600 ${Math.round(Math.min(w,h)*.034)}px "Be Vietnam Pro",Arial,sans-serif`; x.fillStyle='rgba(255,255,255,.85)'; x.textAlign='right';
  x.fillText(`ẢNH MẪU ${String(i+1).padStart(2,'0')}`,w-Math.min(w,h)*.04,h-Math.min(w,h)*.04);
  return c;
}
async function loadSamples(){
  const ids=[];
  for(let i=0;i<16;i++){const c=drawSample(i),blob=await toBlob(c,.86),thumbBlob=await toBlob(scaled(c,360,c.width,c.height),.8),id=uid('p');
    PH[id]={id,name:`Ảnh mẫu ${String(i+1).padStart(2,'0')}.jpg`,w:c.width,h:c.height,url:URL.createObjectURL(blob),thumb:URL.createObjectURL(thumbBlob),file:blob,prevBlob:null,thumbBlob,sample:true}; ids.push(id);}
  if(S.lib.some(id=>!PH[id].sample)) return;     // người dùng đã thêm ảnh thật trong lúc chờ
  S.lib.push(...ids); autoFill(ids,false); render();
  for(const id of ids) await materialize(PH[id],false);   // lưu ngầm vào bộ nhớ đệm sau khi đã hiện
  persistNow();
}

function boot(){
  $$('[data-ico]').forEach(n=>{n.outerHTML=ico(n.dataset.ico);});
  initAlbum(); bindStage(); bindPanels(); bindControls(); render();
  let rt=0; new ResizeObserver(()=>{cancelAnimationFrame(rt); rt=requestAnimationFrame(()=>{if(V.zoom==='fit') renderStage(); else {updateOrigin(); drawRulers();} if(!$('#bookModal').hidden&&!B.anim) bookRender();});}).observe($('#vp'));
  window.addEventListener('resize',()=>{if(!$('#bookModal').hidden&&!B.anim) bookRender();});
  $('#book').addEventListener('click',e=>{const r=$('#book').getBoundingClientRect(); bookGo(e.clientX>r.left+r.width/2?1:-1);});
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{renderStage(); renderStrip();});
  startup();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
